<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulador de Casos RAMS (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Concepto: consola de entrenamiento. Franja de estado fija (reloj, barreras, registro) sobre una columna de lectura.
   Color: azul ML1 como mando, amarillo como señal de atención, rojo solo para riesgo. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#16202c; --ink-soft:#566273; --line:#d3dbe7;
  --brand:#004090; --brand-strong:#00306c; --brand-soft:#e3ebf7; --signal:#f0d010; --signal-soft:#fff6cc; --signal-ink:#5c4a00;
  --ok:#1d7446; --ok-soft:#e2f3e9; --warn:#8a5a00; --warn-soft:#fdf0d3; --risk:#c01020; --risk-soft:#fbe5e7;
  --on-brand:#ffffff;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:Inter,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1520; --surface:#16202d; --surface-2:#1c2838; --ink:#e7edf5; --ink-soft:#9fadbf; --line:#2c3a4d;
    --brand:#6fa3ec; --brand-strong:#9cc0f3; --brand-soft:#1b2e4a; --signal:#f0d010; --signal-soft:#3a3212; --signal-ink:#f5e27a;
    --ok:#5cc98d; --ok-soft:#143323; --warn:#e8b34f; --warn-soft:#3a2c10; --risk:#f07480; --risk-soft:#3d171c;
    --on-brand:#0e1520; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1520; --surface:#16202d; --surface-2:#1c2838; --ink:#e7edf5; --ink-soft:#9fadbf; --line:#2c3a4d;
  --brand:#6fa3ec; --brand-strong:#9cc0f3; --brand-soft:#1b2e4a; --signal:#f0d010; --signal-soft:#3a3212; --signal-ink:#f5e27a;
  --ok:#5cc98d; --ok-soft:#143323; --warn:#e8b34f; --warn-soft:#3a2c10; --risk:#f07480; --risk-soft:#3d171c;
  --on-brand:#0e1520; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{background:var(--surface);border-bottom:4px solid var(--signal)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
header.top img{height:40px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.brandname{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--brand);line-height:1.1}
.brandsub{font-size:13px;color:var(--ink-soft)}
h1,h2,h3{font-family:var(--f-display);color:var(--brand);text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:23px;line-height:1.2}
h3{font-size:18px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.muted{color:var(--ink-soft);font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text],input[type=time],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:none;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--brand);color:var(--on-brand)}
.btn:hover{background:var(--brand-strong)}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.choice{font:inherit;color:inherit;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.choice:hover{border-color:var(--brand)}
.choice.sel{border-color:var(--brand);background:var(--brand-soft)}
.choice .t{font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--brand)}
.choice .d{font-size:14px;color:var(--ink-soft)}
.caselist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.case{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.case:hover{border-color:var(--brand)}
.case .ref{font-size:12px;color:var(--ink-soft)}
.case .tag{align-self:flex-start}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--brand-soft);color:var(--brand)}
.tag.best{background:var(--ok-soft);color:var(--ok)}
.tag.ok{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--risk-soft);color:var(--risk)}
details.other summary{cursor:pointer;font-weight:600;color:var(--brand)}
/* franja de estado */
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.meter .ml{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.meter .mv{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.shields{display:flex;gap:6px;padding-top:6px}
.shields span{width:20px;height:22px;border-radius:4px 4px 10px 10px;background:var(--ok)}
.shields span.off{background:var(--line)}
.clock{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--on-brand);background:var(--brand);border-radius:6px;padding:2px 10px;font-variant-numeric:tabular-nums}
.situ{background:var(--surface-2);border-left:5px solid var(--brand);border-radius:8px;padding:12px 14px}
.alarm{background:var(--risk-soft);border-left:5px solid var(--risk);border-radius:8px;padding:12px 14px;font-weight:600}
.radio{background:var(--signal-soft);border-left:5px solid var(--signal);border-radius:8px;padding:12px 14px;color:var(--signal-ink);font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt .k{font-family:var(--f-display);font-weight:700;color:var(--brand)}
.opt[disabled]{cursor:default}
.opt.best{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok{border-color:var(--warn);background:var(--warn-soft)}
.opt.bad{border-color:var(--risk);background:var(--risk-soft)}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.best{background:var(--ok-soft)} .fb.ok{background:var(--warn-soft)} .fb.bad{background:var(--risk-soft)}
.fb .h{font-weight:700}
.fb .rams{font-size:14px}
.fb .ref{font-size:13px;color:var(--ink-soft)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.formgrid .full{grid-column:1/-1}
.fixed{padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2)}
.score{font-family:var(--f-display);font-size:56px;font-weight:700;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.part{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.part .pv{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--ink-soft);font-weight:600}
.lesson{background:var(--signal-soft);color:var(--ink);border-radius:10px;padding:12px 14px}
footer.note{font-size:12px;color:var(--ink-soft);text-align:center;padding-bottom:24px}
@media (max-width:640px){.grid3,.caselist,.meters,.parts,.formgrid{grid-template-columns:1fr}.meters{grid-template-columns:repeat(3,minmax(0,1fr))}.meter .mv{font-size:19px}h1{font-size:25px}}
@media (prefers-reduced-motion:no-preference){.opt,.choice,.case{transition:border-color .15s,background-color .15s}}
</style>

<header class="top"><div class="wrap">
  <img id="logo" alt="Metro Línea 1">
  <div><div class="brandname">Simulador de casos RAMS</div><div class="brandsub">Curso "Metro seguro y disponible: tu papel en RAMS" · Personal operativo L1MB</div></div>
</div></header>
<main class="wrap" id="app"></main>
<footer class="note wrap">Uso interno de ML1. Casos basados en la Norma de Operaciones L1MB (L1T1-0000-000-CON-CN-OYM-MA-0004) y sus anexos. Siempre prima el procedimiento vigente.</footer>

     {t:"Ordenar que el tren salte E06 y siga hasta la terminal, donde hay más personal.", q:"bad", min:6,
      fb:"Se retrasa la atención de una persona inconsciente varios minutos sin razón.", rams:"La vida está primero que la comodidad operativa.", ref:REG+", §9.2.2."}
    ]},
   {hora:"18:14", texto:"El tren va hacia E06. ¿Cómo coordina con la estación?",
    ops:[
     {t:"\"Control a estación cero-seis, responda.\" Le informa que el Tren uno-uno-dos llega a vía dos con una persona indispuesta en el coche cuatro, que se prepare para atenderla en la plataforma, y pide colación.", q:"best", min:0,

   {hora:"18:22", situ:"El personal de estación atendió al pasajero y ya salió del tren con los servicios de emergencia.",

     {t:"Liberar el tren apenas baje el pasajero, sin rearmar el interfono.", q:"bad", min:0, barrera:true,

     {t:"Rearmar y liberar, pero no registrarlo porque no fue una falla técnica.", q:"bad", min:0,

   categorias:["Novedad operativa"], receptores:["Estación (personal de plataforma)","Jefe de Estación de Turno (JET)"], canales:["Radio TETRA"],

 },

 {id:"cot-estado-puerta", rol:"cot", titulo:"Pérdida de estado de una puerta del tren",
  resumen:"El Tren 105 frena de emergencia entre E03 y E04 porque perdió el estado de una puerta.",
  ref:REG+", §4.2 y §5.3.1",
  contexto:"Hora punta de la mañana. Usted es el conductor a bordo (COT) del Tren uno-cero-cinco (105), que circula en UTO con pasajeros.",
  minBase:1,
  pasos:[
   {hora:"07:55", alarma:"El tren aplica frenado de emergencia entre E03 y E04, vía 1. La consola indica: pérdida de estado de la puerta 2 del coche 3.",
    texto:"¿Qué hace primero?",
    ops:[
     {t:"Ir a la puerta afectada, mantener a los pasajeros alejados y verificar que no exista riesgo de caída; luego reportar al CCO lo que encuentra.", q:"best", min:2,
      fb:"El reglamento indica actuar tras verificar que no existe riesgo de caída de pasajeros.", rams:"Primero las personas, después el tren.", ref:REG+", §5.3.1 (pérdida de estado de una puerta)."},
     {t:"Accionar de una vez el bypass de puertas para que el tren pueda moverse.", q:"bad", min:0, barrera:true,
      fb:"No sabe si la puerta está abierta. Moverse con un bypass sin verificar puede hacer que alguien caiga del tren.", rams:"Nunca se puentea una protección sin verificar.", ref:REG+", §5.3.1."},
     {t:"Quedarse en la cabina esperando que el CCO lo resuelva de forma remota.", q:"ok", min:4,
      fb:"Esta falla requiere que alguien verifique la puerta en sitio, y usted es quien está a bordo.", rams:"La barrera humana a bordo es usted.", ref:REG+", §2.3.3."}
    ]},
   {hora:"07:58", situ:"La puerta está cerrada físicamente, pero el sistema no detecta su estado.",
    texto:"¿Cómo continúa?",
    ops:[
     {t:"Reportar al CCO \"puerta cerrada con falla en la detección\" y solicitar autorización para accionar el bypass y conducir en modo MCS o EM hasta la estación más cercana.", q:"best", min:1,
      fb:"El reglamento prevé el bypass y la conducción manual hasta la estación más cercana, pero cambiar de modo requiere autorización previa del OCIR.", rams:"Degradar el modo es decisión del CCO, no del conductor.", ref:REG+", §4.2.2 y §5.3.1."},
     {t:"Accionar el bypass y pasar a modo EM por iniciativa propia, porque la puerta está cerrada.", q:"bad", min:0, barrera:true,
      fb:"El conductor no puede degradar el modo por iniciativa propia, salvo riesgo inminente para la vida. El CCO debe saber que el tren se moverá sin protección.", rams:"La autorización es la barrera que protege a los demás trenes.", ref:REG+", §4.2.2."},
     {t:"Pedir al CCO que active el RCE de línea para detener todos los trenes mientras revisa.", q:"ok", min:8,
      fb:"No hay un riesgo inminente que lo justifique; el sistema ya protegió la zona. Se detiene toda la línea sin necesidad.", rams:"Proporcionalidad.", ref:REG+", §9.2.3."}
    ]},
   {hora:"08:00", radio:"CCO: \"Tren uno-cero-cinco, accione el bypass de puertas y circule en modo EM hasta estación cero-cuatro, vía uno. Confirme colación.\"",
    texto:"Después de colacionar, ¿cómo conduce?",
    ops:[
     {t:"En modo EM a máximo 25 km/h, bajo supervisión continua del CCO, y entrando a la estación E04 a no más de 25 km/h.", q:"best", min:3,
      fb:"En modo EM no hay protección ATP: el límite es 25 km/h en línea principal y en la entrada a estación.", rams:"Modo degradado: menos velocidad, más atención.", ref:REG+", §4.1.4 y §4.2."},
     {t:"A 40 km/h, para recuperar el tiempo perdido.", q:"bad", min:2, barrera:true,
      fb:"Supera el límite del modo EM. Sin ATP, su velocidad es la única protección.", rams:"La velocidad límite es una barrera.", ref:REG+", §4.1.4."},
     {t:"A 25 km/h, pero sin comunicarse con el CCO hasta llegar.", q:"bad", min:3, barrera:true,
      fb:"En modo EM el reglamento exige la supervisión continua del CCO.", rams:"Sin comunicación no hay supervisión.", ref:REG+", §4.2.1."}
    ]},
   {hora:"08:05", situ:"El tren se detuvo en la Estación E04, vía 1.",
    texto:"¿Qué hace ahora?",
    ops:[
     {t:"Coordinar con el personal de estación la evacuación de todos los pasajeros, informarles con mensajes claros y reportar la novedad al CCO y al Capitán de Trenes antes de retirar el tren.", q:"best", min:3,
      fb:"El reglamento indica evacuar y retirar el tren del servicio. El Capitán de Trenes consolida las novedades de conducción.", rams:"Un reporte completo es el inicio del análisis FRACAS.", ref:REG+", §2.3.3 y §5.3.1."},
     {t:"Seguir con los pasajeros hasta la terminal, porque el tren todavía se mueve.", q:"bad", min:0, barrera:true,
      fb:"Con la detección de puerta en falla, el tren debe evacuarse y salir de servicio.", rams:"No se presta servicio con una protección anulada.", ref:REG+", §5.3.1."},
     {t:"Evacuar y retirar el tren sin reportar nada; mantenimiento verá la alarma.", q:"bad", min:3,
      fb:"La alarma no dice lo que usted vio: si la puerta estaba cerrada, qué hizo y a qué hora. Sin eso, el diagnóstico empieza de cero.", rams:"Mantenibilidad: su reporte acorta la reparación.", ref:REG+", §2.3.3 y §11."}
    ]}
  ],
  reporte:{titulo:"Reporte de la novedad al CCO", emisor:"COT – Tren 105", hora:"07:55",
   ubicaciones:["Estación E03 – vía 1","Entre E03 y E04 – vía 1","Estación E04 – vía 1","Entre E03 y E04 – vía 2"], ubicacion:"Entre E03 y E04 – vía 1",
   categorias:["Incidente – alarma de fallo"], receptores:["CCO"], canales:["Radio TETRA"],
   claves:["puerta","105","coche","bypass","deteccion","detección","evacu"]},
  leccion:"Con una falla de puerta: verificar que nadie pueda caer, reportar con precisión, cambiar de modo solo con autorización, respetar los 25 km/h del modo EM y evacuar en la estación más cercana."
 },

 {id:"cot-no-comunicante", rol:"cot", titulo:"Tren no comunicante",
  resumen:"El Tren 108 pierde la comunicación con el sistema de señalización entre E10 y E11.",
  ref:REG+", §3.1, §4.2 y §5.3.1",
  contexto:"Mediodía. Usted es el conductor a bordo (COT) del Tren uno-cero-ocho (108), que circula en UTO con pasajeros.",
  minBase:1,
  pasos:[
   {hora:"13:20", alarma:"El tren aplica frenado de emergencia entre E10 y E11, vía 2. La consola indica pérdida de comunicación con la señalización (tren no comunicante).",
    texto:"¿Qué hace primero?",
    ops:[
     {t:"Llamar al CCO (\"Tren uno-cero-ocho a control, responda\"), reportar la situación y esperar instrucciones.", q:"best", min:1,
      fb:"Reporta de inmediato con la estructura correcta y no actúa sin la autorización del CCO.", rams:"El CCO es quien ve toda la línea.", ref:REG+", §3.1 y Anexo 01."},
     {t:"Pasar a modo EM de inmediato, porque el procedimiento dice que el conductor conmuta a EM.", q:"bad", min:0, barrera:true,
      fb:"El reglamento sí prevé el modo EM para esta falla, pero la degradación de modo requiere autorización previa del OCIR. Sin ella, el CCO no sabe que hay un tren moviéndose sin protección.", rams:"Hacer lo correcto en el orden equivocado también es un riesgo.", ref:REG+", §4.2.2 y §5.3.1."},
     {t:"Esperar en silencio a que el sistema se recupere.", q:"ok", min:5,
      fb:"El CCO ya ve la alarma, pero necesita su confirmación desde el tren. Esperar en silencio solo suma minutos.", rams:"El tiempo de reacción es parte de la duración de la falla.", ref:REG+", §2.3.3."}
    ]},
   {hora:"13:22", radio:"CCO: \"Tren uno-cero-ocho, conmute a modo EM y circule hasta estación uno-uno, vía dos. Confirme colación.\"",
    texto:"¿Cómo responde?",
    ops:[
     {t:"\"Tren uno-cero-ocho: conmuto a modo EM y circulo hasta estación uno-uno, vía dos.\" Espera el \"Correcto, tren uno-cero-ocho\" antes de moverse.", q:"best", min:1,
      fb:"Colación completa y cierre del ciclo antes de actuar.", rams:"La colación asegura que usted y el CCO entendieron lo mismo.", ref:REG+", §3.1.4 a §3.1.6."},
     {t:"\"Recibido, control\", y arranca.", q:"bad", min:0, barrera:true,
      fb:"\"Recibido\" sin repetir la orden está prohibido, y arrancó sin que el CCO cerrara la comunicación.", rams:"Sin colación no hay confirmación.", ref:REG+", §3.1.4."},
     {t:"\"Entendido, ciento ocho, voy para la once.\"", q:"bad", min:0,
      fb:"Expresión informal, números sin decir cifra por cifra y sin el modo de conducción. Así se generan malentendidos.", rams:"La forma de hablar por radio también es una barrera.", ref:REG+", §3.1.7."}
    ]},
   {hora:"13:24", texto:"Ya está en modo EM. ¿Cómo conduce hasta E11?",
    ops:[
     {t:"A máximo 25 km/h, atento a la vía y a los indicadores de posición de cambiavías, y deteniéndose para pedir confirmación al CCO ante cualquier duda.", q:"best", min:4,
      fb:"En modo EM no hay ATP: la autorización la da el CCO, que confirma que la ruta está despejada, y la velocidad máxima es 25 km/h.", rams:"Sin protección automática, la barrera es usted.", ref:REG+", §4.1.4, §4.2.1 y §4.3."},
     {t:"A 50 km/h, porque la vía estaba despejada hace un minuto.", q:"bad", min:2, barrera:true,
      fb:"Duplica el límite del modo EM. Lo que estaba despejado hace un minuto no tiene por qué estarlo ahora.", rams:"La velocidad límite es una barrera.", ref:REG+", §4.1.4."},
     {t:"A 25 km/h, pero con el radio en volumen bajo para concentrarse.", q:"bad", min:4, barrera:true,
      fb:"En modo EM la supervisión del CCO es continua: debe poder escuchar cualquier orden de detención.", rams:"Comunicación permanente con el CCO.", ref:REG+", §2.3.3 y §4.2.1."}
    ]},
   {hora:"13:30", situ:"El tren llegó a la Estación E11, vía 2. Mientras se detiene, la consola indica que el tren vuelve a comunicar.",
    texto:"¿Qué hace?",
    ops:[
     {t:"Evacuar a los pasajeros con apoyo de la estación, informarles con claridad, pedir instrucciones al CCO para retirar el tren y reportar la novedad al Capitán de Trenes.", q:"best", min:4,
      fb:"El reglamento indica retirar el tren de la línea. Que vuelva a comunicar no significa que la falla esté resuelta.", rams:"Una falla que aparece y desaparece se reporta y se analiza.", ref:REG+", §2.3.3 y §5.3.1."},
     {t:"Volver a modo UTO por su cuenta, porque el tren ya comunica.", q:"bad", min:0, barrera:true,
      fb:"Restablecer el modo también requiere autorización previa del OCIR.", rams:"Ni degradar ni restablecer el modo por iniciativa propia.", ref:REG+", §4.2.2."},
     {t:"Dejar el tren con pasajeros en la estación mientras revisa los equipos.", q:"bad", min:6,
      fb:"Los pasajeros quedan sin información y el tren ocupa la plataforma. Primero se evacua y se coordina con el CCO.", rams:"Primero las personas.", ref:REG+", §5.3.1."}
    ]}
  ],
  reporte:{titulo:"Reporte de la novedad al CCO", emisor:"COT – Tren 108", hora:"13:20",
   ubicaciones:["Estación E10 – vía 2","Entre E10 y E11 – vía 2","Estación E11 – vía 2","Entre E10 y E11 – vía 1"], ubicacion:"Entre E10 y E11 – vía 2",
   categorias:["Incidente – alarma de fallo"], receptores:["CCO"], canales:["Radio TETRA"],
   claves:["108","comunic","EM","frenado","evacu"]},
  leccion:"En un tren no comunicante: reportar primero, cambiar de modo solo con autorización, colacionar la orden, conducir a 25 km/h con atención total y no restablecer el modo por cuenta propia aunque el tren vuelva a comunicar."
 },

 {id:"aux-pdap", rol:"aux", titulo:"Falla de puerta de andén en hora punta",
  resumen:"Una puerta de andén (PDAP) no abre cuando llega el tren a la Estación E08.",
  ref:REG+", §6.2.1 y §6.4.3",
  contexto:"Hora punta de la mañana. Usted es Auxiliar de Estación (AUX) en la Estación E08. El andén de la vía 1 está lleno.",
  minBase:1,
  pasos:[
   {hora:"08:05", alarma:"Llega un tren a la vía 1 y la puerta de andén del módulo 12 no abre. Los pasajeros se agolpan frente a ella.",
    texto:"¿Qué hace primero?",
    ops:[
     {t:"Acudir de inmediato al módulo, asegurar y segregar la zona, e informar al JET.", q:"best", min:0,
      fb:"Es exactamente lo que asigna el reglamento al AUX ante una falla de PDAP.", rams:"Primero garantizar la operación segura, luego gestionar la reparación.", ref:REG+", §6.4.3 (Tabla de actividades ante falla de PDAP)."},
     {t:"Llamar a mantenimiento y esperar a que llegue.", q:"ok", min:4,
      fb:"Mientras espera, la zona queda sin control y los pasajeros siguen agolpados frente a una puerta en falla.", rams:"La atención inicial le corresponde a la estación.", ref:REG+", §6.4.3."},
     {t:"Intentar abrir la puerta a la fuerza para que los pasajeros pasen.", q:"bad", min:0, barrera:true,
      fb:"Forzar una PDAP puede dejarla abierta frente a la vía cuando el tren se vaya.", rams:"No se fuerza una barrera física.", ref:REG+", §6.4.3."}
    ]},
   {hora:"08:06", texto:"Los pasajeros siguen esperando frente a la puerta dañada. ¿Qué hace?",
    ops:[
     {t:"Hacer anuncios y guiar a los pasajeros para subir y bajar por los módulos habilitados.", q:"best", min:0,
      fb:"Es parte de las actividades del AUX ante una falla de PDAP.", rams:"Gestionar el flujo evita aglomeraciones y retrasos.", ref:REG+", §6.4.3."},
     {t:"Dejar que los pasajeros se organicen solos.", q:"ok", min:2,
      fb:"Sin orientación, la gente se acumula y el tren tarda más en salir.", rams:"Disponibilidad: cada segundo de parada suma.", ref:REG+", §6.4.3."},
     {t:"Pedir a los pasajeros que esperen el siguiente tren frente a esa misma puerta.", q:"ok", min:3,
      fb:"La puerta seguirá en falla con el siguiente tren. Se crea una aglomeración frente a un módulo inhabilitado.", rams:"Prevenir el riesgo de aglomeración.", ref:REG+", §6.5."}
    ]},
   {hora:"08:08", texto:"Mantenimiento tardará en llegar. ¿Qué hace con la puerta?",
    ops:[
     {t:"Notificar al CCO y pedir autorización. Solo con ella, aislar la puerta, señalizar el módulo y verificar el espacio entre la PDAP y el tren.", q:"best", min:1,
      fb:"El aislamiento de una PDAP requiere autorización del CCO.", rams:"Un cambio en la configuración de la estación se autoriza antes de hacerse.", ref:REG+", §6.2.1 (niveles de actuación) y §6.4.3."},
     {t:"Aislar la puerta de inmediato para ganar tiempo y avisar después.", q:"bad", min:0, barrera:true,
      fb:"Aislar sin autorización cambia el estado de la estación sin que el CCO lo sepa.", rams:"Nada se cambia por cuenta propia.", ref:REG+", §6.2.1."},
     {t:"Usar el Panel de Control Local (PCL) para forzar el estado de las puertas y dejar salir el tren.", q:"bad", min:0, barrera:true,
      fb:"El PCL solo se opera por instrucción expresa del CCO. Su apertura genera alerta en el CCO.", rams:"Los mandos de seguridad tienen dueño.", ref:REG+", §6.4.4."}
    ]},
   {hora:"08:15", texto:"La puerta quedó aislada y señalizada. ¿Qué hace con la información?",
    ops:[
     {t:"Reportar al JET la falla y el aislamiento (hora, módulo, vía y acciones tomadas) para que quede en el Registro Diario, y mantener vigilado el módulo aislado.", q:"best", min:0,
      fb:"La falla, el aislamiento y el uso de puertas son eventos de reporte obligatorio al JET.", rams:"FRACAS empieza con su reporte.", ref:REG+", §6.7.3 (eventos de reporte obligatorio)."},
     {t:"No reportarlo, porque mantenimiento ya sabe.", q:"bad", min:0,
      fb:"El reporte es obligatorio aunque otros lo sepan. Sin registro no hay trazabilidad.", rams:"Si no está registrado, no existe para el análisis.", ref:REG+", §6.7.3."},
     {t:"Reportarlo solo si la puerta vuelve a fallar.", q:"bad", min:0,
      fb:"La primera falla ya es información. Si se repite, el reporte anterior ayuda a encontrar la causa.", rams:"Si se repite, no es mala suerte: es una señal.", ref:REG+", §6.7.3."}
    ]}
  ],
  reporte:{titulo:"Reporte al Jefe de Estación de Turno", emisor:"AUX – Estación E08", hora:"08:05",
   ubicaciones:["Estación E08 – vía 1","Estación E08 – vía 2","Estación E07 – vía 1","Estación E09 – vía 1"], ubicacion:"Estación E08 – vía 1",
   categorias:["Incidente – alarma de fallo"], receptores:["Jefe de Estación de Turno (JET)"], canales:["Radio TETRA","Presencial"],
   claves:["puerta","pdap","modulo","módulo","12","aisl"]},
  leccion:"Ante una falla de PDAP: asegurar la zona, guiar a los pasajeros, aislar solo con autorización del CCO y reportar al JET. Primero la operación segura, luego la reparación."
 },

 {id:"aux-via", rol:"aux", titulo:"Objeto y persona en la vía",
  resumen:"A una usuaria se le cae el celular a la vía en la Estación E12 y su acompañante intenta bajar.",
  ref:REG+", §6.2.1, §6.4.5 y §9.2.3",
  contexto:"Hora punta de la tarde. Usted es Auxiliar de Estación (AUX) en la Estación E12, plataforma de la vía 2.",
  minBase:0,
  pasos:[
   {hora:"17:40", situ:"Una usuaria le dice que se le cayó el celular a la vía. El próximo tren llega en tres minutos.",
    texto:"¿Qué hace?",
    ops:[
     {t:"No bajar ni dejar que nadie baje; mantener a la usuaria detrás de la franja de seguridad e informar al JET y al CCO para recuperar el objeto de forma segura más tarde.", q:"best", min:0,
      fb:"Un objeto que no afecta la circulación no justifica detener trenes, y el ingreso a la vía solo se hace por instrucción expresa del CCO.", rams:"Proporcionalidad y control del acceso a la vía.", ref:REG+", §6.2.1 y §9.2.3 (caída de objetos a la vía)."},
     {t:"Presionar el RCE de plataforma para detener los trenes y bajar a recoger el celular.", q:"bad", min:6, barrera:true,
      fb:"El reglamento prohíbe usar el RCE para recuperar un objeto que no afecta la circulación, y nadie baja a la vía sin instrucción expresa y corte de energía.", rams:"Los dispositivos de emergencia son para emergencias.", ref:REG+", §9.2.2 y §9.2.3."},
     {t:"Bajar rápido a recogerlo antes de que llegue el tren.", q:"bad", min:0, barrera:true,
      fb:"Riesgo de atropello y de electrocución con el tercer riel. Ningún objeto vale ese riesgo.", rams:"La vida primero.", ref:REG+", §9.2.2 (corte de energía para descenso a vía)."}
    ]},
   {hora:"17:42", alarma:"El acompañante de la usuaria salta a la vía para buscar el celular. El tren se aproxima a la estación.",
    texto:"¿Qué hace?",
    ops:[
     {t:"Accionar de inmediato el RCE de plataforma más cercano y notificar al CCO enseguida.", q:"best", min:5,

  var e = document.createElement(tag);

}
function norm(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

function categoriaAT11(min){

function elegir(i){
  var c = casoActual(), p = c.pasos[S.paso], o = p.ops[i];
  var bi = p.ops.map(function(x){ return x.q; }).indexOf("best");
  S.minutos += o.min; if(o.barrera && S.barreras > 0) S.barreras--;
  S.respuestas.push({hora:p.hora, pregunta:p.texto, elegida:o.t, calidad:o.q, mejor:p.ops[bi].t, ref:o.ref});
  Array.prototype.forEach.call(document.getElementById("opts").children, function(b, idx){
    b.disabled = true;
    if(idx === i) b.classList.add(o.q); else if(idx === bi) b.classList.add("best"); else b.classList.add("dim");
  });
  var titulo = o.q === "best" ? "Buena decisión" : (o.q === "ok" ? "Se puede hacer mejor" : "Decisión de riesgo");
  var efectos = [];
  if(o.barrera) efectos.push("Se perdió una barrera de seguridad.");
  if(o.min) efectos.push("Sumó " + o.min + " min de servicio perdido.");
  var fb = document.getElementById("fb"); fb.innerHTML = "";
  fb.appendChild(h("div", {class:"fb " + o.q}, [
    h("span", {class:"h", text:titulo}), h("span", {text:o.fb + (efectos.length ? " " + efectos.join(" ") : "")}),
    h("span", {class:"rams", text:"Idea RAMS: " + o.rams}), h("span", {class:"ref", text:"Referencia: " + o.ref})]));
  var old = document.querySelector(".status"); old.parentNode.replaceChild(franja(), old);
  var sig = document.getElementById("sig"); sig.hidden = false;
  sig.textContent = S.paso + 1 < c.pasos.length ? "Siguiente decisión" : "Diligenciar el registro";
  sig.onclick = function(){ S.paso++; if(S.paso < c.pasos.length) pantallaPaso(); else pantallaRegistro(); };
  sig.focus();
}

function calificar(){

  var nc = norm(v.contenido);
  var claves = r.claves.filter(function(k){ return nc.indexOf(norm(k)) >= 0; }).length;
  var checks = [
    {n:"Fecha en formato AAAA/MM/DD", ok:v.fecha === FECHA_CASO, tip:"Debía ser " + FECHA_CASO + ", con año, mes y día separados por barras."},
    {n:"Hora del evento", ok:v.hora === r.hora, tip:"El evento empezó a las " + r.hora + ". La hora exacta permite cruzar el registro con los sistemas."},
    {n:"Ubicación", ok:v.ubicacion === r.ubicacion, tip:"Correcta: " + r.ubicacion + "."},
    {n:"Categoría", ok:r.categorias.indexOf(v.categoria) >= 0, tip:"Correcta: " + r.categorias.join(" u ") + "."},
    {n:"Contenido completo", ok:v.contenido.length >= 60 && claves >= 2, tip:"Describa qué pasó, con el tren, equipo o lugar y lo que se hizo (al menos dos datos clave y unas dos frases)."},
    {n:"Receptor", ok:r.receptores.indexOf(v.receptor) >= 0, tip:"Debía ir a: " + r.receptores.join(" o ") + "."},
    {n:"Canal", ok:r.canales.indexOf(v.canal) >= 0, tip:"Canal esperado: " + r.canales.join(" o ") + "."}
  ];
  S.reporte = {valores:v, checks:checks};
  pantallaResultado();
}

function puntajes(){

  var okR = S.reporte.checks.filter(function(k){ return k.ok; }).length;
  var rep = Math.round(30 * okR / S.reporte.checks.length);
  return {dec:dec, bar:bar, rep:rep, okR:okR, total:dec + bar + rep};
}

// ===== Envío de resultados a Google Sheets =====
// Pegue aquí la URL de su aplicación web de Apps Script (termina en /exec).
var SHEETS_URL = "https://script.google.com/macros/s/AKfycbyukk96QiL2NcfdEbAWZLhr65jH6udB5ndqQOVMuKWPl-UgE60yB6i9xCV70mYitlY1xA/exec";
var ACTIVIDAD = "Simulador de casos RAMS";
function datosResultado(P){
  var c = casoActual(), d = new Date();
  var f = d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  var enc = ["Fecha de la práctica","Nombre","Especialidad del caso","Caso","Puntaje total","Decisiones (40)","Barreras (30)","Registro (30)","Minutos perdidos","Categoría AT11"];
  var fila = [f, S.nombre, ROLES[c.rol].nombre, c.titulo, P.total, P.dec, P.bar, P.rep, S.minutos, categoriaAT11(S.minutos)];
  S.respuestas.forEach(function(x, i){ enc.push("Decisión " + (i + 1)); fila.push((x.calidad === "best" ? "Buena" : (x.calidad === "ok" ? "Mejorable" : "De riesgo")) + ": " + x.elegida); });
  S.reporte.checks.forEach(function(k){ enc.push("Registro - " + k.n); fila.push(k.ok ? "Bien" : "Falta"); });
  enc.push("Registro - contenido"); fila.push(S.reporte.valores.contenido);
  return {enc:enc, fila:fila};
}
function enviarASheets(P, msgS){
  if(!SHEETS_URL){ msgS.textContent = ""; return; }
  var D = datosResultado(P);
  var cuerpo = JSON.stringify({actividad: ACTIVIDAD, hoja: casoActual().titulo, encabezados: D.enc, fila: D.fila});
  msgS.textContent = "Enviando su resultado al instructor…";
  fetch(SHEETS_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:cuerpo})
    .then(function(){ msgS.textContent = "✔ Resultado enviado al instructor."; })
    .catch(function(){ msgS.textContent = "No se pudo enviar el resultado. Descargue el CSV y entrégueselo al instructor."; });
}

function csvCampo(x){ x = String(x == null ? "" : x).replace(/\r?\n/g, " "); return '"' + x.replace(/"/g, '""') + '"'; }
function construirCSV(P){
  var D = datosResultado(P);
  return "\ufeff" + D.enc.map(csvCampo).join(";") + "\r\n" + D.fila.map(csvCampo).join(";") + "\r\n";
}
function nombreArchivo(){
  var c = casoActual();
  return ("resultado_" + S.nombre + "_" + c.id).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9_-]+/g, "_") + ".csv";
}
function exportar(P, msg){
  var csv = construirCSV(P), name = nombreArchivo();
  var viaClaude = window.claude && typeof window.claude.use === "function";
  if(viaClaude){
    msg.textContent = "Preparando la descarga…";
    window.claude.use("downloads").then(function(dl){
      if(!dl){ msg.textContent = "La descarga no está disponible en esta vista. Muestre esta pantalla al instructor."; return; }
      return dl.save({filename:name, data:csv}).then(function(){ msg.textContent = "Archivo " + name + " guardado. Entréguelo al instructor."; },
        function(e){ msg.textContent = (e && e.code === "declined") ? "Descarga cancelada." : "No se pudo descargar el archivo. Muestre esta pantalla al instructor."; });
    }, function(){ msg.textContent = "No se pudo descargar el archivo. Muestre esta pantalla al instructor."; });
    return;
  }
  try{
    var blob = new Blob([csv], {type:"text/csv;charset=utf-8"}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    msg.textContent = "Se descargó el archivo " + name + ". Entréguelo al instructor.";
  }catch(e){ msg.textContent = "No se pudo descargar el archivo en este equipo. Muestre esta pantalla al instructor."; }
}

pantallaInicio();
</script>
